<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
</head>
<body>
    {% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <span class="eyebrow">SECURITY</span>
        <h1>Change Password</h1>
        <p>Update your account password securely.</p>
    </div>
</div>

<section class="panel form-panel" style="max-width: 500px;">
    <div class="panel-heading">
        <div>
            <h2>Create a new password</h2>
            <p>Must be at least 10 characters long.</p>
        </div>
        <span class="stat-icon purple">🔒</span>
    </div>
    
    <form method="post" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <label>
            Current Password
            <input name="current_password" type="password" required>
        </label>
        
        <label>
            New Password
            <input name="new_password" type="password" minlength="10" required>
        </label>
        
        <label>
            Confirm New Password
            <input name="confirm_password" type="password" minlength="10" required>
        </label>
        
        <button class="btn primary full" type="submit" style="margin-top: 10px;">Update Password</button>
    </form>
</section>
{% endblock %}
</body>
</html>
